<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ColorAVI">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fff0f6">
<title>ColorAVI</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #fff0f6;
    --panel: #ffffff;
    --ink: #4a2b3c;
    --muted: #b08aa0;
    --pink: #ff5fa2;
    --pink-dark: #d93f82;
    --pink-soft: #ffe1ee;
    --pink-line: #f6bcd6;
    --sun: #fff3a8;
    --sun-dark: #e6c94a;
    --cur: #e53935;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Varela Round", system-ui, sans-serif;
    background: var(--bg) radial-gradient(#ffd3e6 2px, transparent 2px) 0 0 / 26px 26px;
    color: var(--ink);
    height: 100dvh;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  svg { display: block; }

  body:not([data-screen="home"]) #home,
  body:not([data-screen="paint"]) #paintScreen,
  body:not([data-screen="puzzle"]) #puzzleScreen { display: none; }

  /* ---------- Home ---------- */
  #home {
    position: fixed; inset: 0; overflow-y: auto;
    padding: max(24px, env(safe-area-inset-top)) 24px 40px;
  }
  .logo { text-align: center; margin: 4px 0 24px; }
  .logo h1 {
    margin: 0; font-size: clamp(44px, 9vw, 72px); font-weight: 900; letter-spacing: -1px;
    color: var(--pink); text-shadow: 0 5px 0 var(--pink-line);
  }
  .logo h1 span { color: #8c6cff; text-shadow: 0 5px 0 #d6cbff; }
  .logo p { margin: 6px 0 0; font-size: 20px; font-weight: 800; color: var(--muted); }
  .modes { display: flex; justify-content: center; gap: 14px; margin: 0 0 26px; }
  .mode {
    padding: 12px 26px; border-radius: 999px; font-size: 22px; font-weight: 900; color: var(--pink-dark);
    background: #fff; box-shadow: 0 5px 0 var(--pink-line), 0 7px 14px #d93f8222;
  }
  .mode.on { background: var(--pink); color: #fff; box-shadow: 0 5px 0 var(--pink-dark), 0 7px 14px #d93f8233; }
  #grid, #pzGrid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 22px;
    max-width: 1100px; margin: 0 auto;
  }
  #grid[hidden], #pzGrid[hidden] { display: none; }
  #pzGrid .dcard img { object-fit: cover; }
  .dcard {
    position: relative; background: var(--panel); border-radius: 26px; padding: 10px 10px 8px;
    box-shadow: 0 6px 0 var(--pink-line), 0 10px 22px #d93f8222; text-align: center;
    transition: transform .12s;
  }
  .dcard:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--pink-line); }
  .dcard img { width: 100%; aspect-ratio: 4/3; object-fit: contain; border-radius: 18px; background: #fff; display: block; }
  .dcard .name { display: block; margin-top: 6px; font-weight: 800; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dcard .del {
    position: absolute; top: -10px; right: -10px; width: 40px; height: 40px; border-radius: 50%;
    background: #fff; color: var(--pink-dark); font-size: 18px; font-weight: 900;
    box-shadow: 0 3px 0 var(--pink-line), 0 4px 10px #0002; display: grid; place-items: center;
  }
  .dcard.add {
    border: 4px dashed var(--pink); background: var(--pink-soft); color: var(--pink-dark);
    display: grid; place-items: center; align-content: center; gap: 4px; min-height: 180px;
    font-size: 20px; font-weight: 900;
  }
  .dcard.add big { font-size: 56px; line-height: 1; }

  /* ---------- Paint screen ---------- */
  #paintScreen {
    position: fixed; inset: 0;
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr);
    padding-top: env(safe-area-inset-top);
  }
  /* Bars are laid out for an iPad (1080×810) and scaled as a whole via --ui, so they never wrap */
  .topbar, .bottombar { zoom: var(--ui, 1); }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; flex-wrap: nowrap; }
  .group { display: flex; align-items: center; gap: 12px; }
  .rbtn {
    width: 60px; height: 60px; border-radius: 50%; background: #fff; display: grid; place-items: center;
    box-shadow: 0 5px 0 var(--pink-line), 0 7px 14px #d93f8222; transition: transform .1s, box-shadow .1s;
  }
  .rbtn svg { width: 38px; height: 38px; }
  .rbtn.pink { background: var(--pink); box-shadow: 0 5px 0 var(--pink-dark), 0 7px 14px #d93f8233; }
  .rbtn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--pink-line); }
  .rbtn:disabled { opacity: .4; cursor: default; }
  .rbtn.on { background: var(--sun); box-shadow: 0 5px 0 var(--sun-dark), 0 7px 14px #d93f8222; }
  .zoom {
    display: flex; align-items: center; gap: 6px; background: #fff; border-radius: 999px; padding: 6px;
    box-shadow: 0 5px 0 var(--pink-line), 0 7px 14px #d93f8222;
  }
  .zbtn { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; background: var(--pink-soft); }
  .zbtn svg { width: 32px; height: 32px; }
  .zbtn:active { background: var(--pink-line); }
  .zbtn.on { background: var(--pink); }
  .zbtn.on svg path { fill: #fff; stroke: var(--pink-dark); }

  .stage { position: relative; min-height: 0; }
  #viewport { position: absolute; inset: 0; overflow: auto; display: flex; touch-action: none; scrollbar-width: none; }
  #viewport::-webkit-scrollbar { display: none; }
  #viewport.pan { cursor: grab; }
  #board { position: relative; margin: auto; flex: none; background: #fff; border-radius: 6px; box-shadow: 0 6px 30px #d93f8222; }
  #board canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .arrow {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
    width: 54px; height: 70px; border-radius: 20px; background: #fffc;
    display: grid; place-items: center; box-shadow: 0 4px 0 var(--pink-line);
  }
  .arrow svg { width: 34px; height: 34px; }
  .arrow.prev { left: 8px; } .arrow.next { right: 8px; }
  .arrow:active { transform: translateY(-50%) scale(.92); }

  .bottombar {
    display: flex; align-items: flex-end; gap: 14px;
    padding: 12px 12px 0 max(12px, env(safe-area-inset-left));
    background: linear-gradient(#ff9fcb, #ff78b4);
    border-top: 6px solid #ffc6e0;
  }
  .tools {
    display: grid; grid-template-columns: repeat(3, 66px); gap: 12px 10px; flex: none;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }
  .tile {
    width: 66px; height: 66px; border-radius: 20px; background: #fff; display: grid; place-items: center;
    box-shadow: 0 5px 0 #e2679f, 0 7px 12px #0002; transition: transform .12s, background .12s;
  }
  .tile svg { width: 48px; height: 48px; }
  .tile.on { background: var(--sun); box-shadow: 0 5px 0 var(--sun-dark), 0 7px 12px #0002; transform: translateY(-3px); }
  .tile:active { transform: translateY(3px); }
  .crayons {
    flex: 1; min-width: 0; height: 172px; display: flex; align-items: flex-end; gap: 10px;
    overflow-x: auto; overflow-y: hidden; padding: 0 10px; scrollbar-width: none;
    touch-action: pan-x; -webkit-overflow-scrolling: touch; cursor: grab;
  }
  .crayons.dragging { cursor: grabbing; }
  .crayons::-webkit-scrollbar { display: none; }
  .crayon { flex: none; width: 70px; height: 172px; position: relative; }
  .crayon svg { width: 70px; height: 164px; transform: translateY(46px); transition: transform .18s cubic-bezier(.3,1.6,.5,1); pointer-events: none; }
  .crayon.on svg { transform: translateY(8px); }

  /* ---------- Puzzle screen ---------- */
  #puzzleScreen {
    position: fixed; inset: 0;
    display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr);
    padding-top: env(safe-area-inset-top);
  }
  .chips {
    display: flex; align-items: center; gap: 6px; background: #fff; border-radius: 999px; padding: 6px 6px 6px 16px;
    box-shadow: 0 5px 0 var(--pink-line), 0 7px 14px #d93f8222;
  }
  .chips span { font-size: 26px; margin-right: 4px; }
  .chip { min-width: 56px; height: 50px; padding: 0 10px; border-radius: 999px; font-size: 22px; font-weight: 900; background: var(--pink-soft); color: var(--pink-dark); }
  .chip.on { background: var(--pink); color: #fff; }
  .pill {
    height: 60px; padding: 0 22px; border-radius: 999px; background: #fff; font-size: 20px; font-weight: 900; color: var(--pink-dark);
    box-shadow: 0 5px 0 var(--pink-line), 0 7px 14px #d93f8222;
  }
  .pill.on { background: var(--sun); color: var(--ink); box-shadow: 0 5px 0 var(--sun-dark), 0 7px 14px #d93f8222; }
  .pz-main {
    display: flex; min-height: 0;
    gap: calc(16px * var(--ui, 1)); padding: calc(6px * var(--ui, 1)) calc(16px * var(--ui, 1)) calc(16px * var(--ui, 1) + env(safe-area-inset-bottom));
  }
  /* No browser gestures (scroll/zoom) over the board or the tray: on iPad they would cancel
     the drag of a piece that is already on the board */
  .pz-main { touch-action: none; }
  .pz-boardwrap { flex: 1; min-width: 0; display: grid; place-items: center; }
  #pzBoard {
    position: relative; display: grid; gap: 4px; padding: 8px; background: #fff; border-radius: 22px;
    box-shadow: 0 0 0 7px #ffd0e5, 0 10px 30px #d93f8222;
  }
  /* Guide: the picture, faint, under the empty spaces */
  #pzBoard::before {
    content: ""; position: absolute; inset: 8px; border-radius: 12px; pointer-events: none;
    background: var(--pz-img) center / 100% 100% no-repeat; opacity: 0; transition: opacity .25s;
  }
  #pzBoard.guide::before { opacity: .18; }
  #pzBoard.guide .pz-slot { background: transparent; }
  .pz-slot .pz-piece.lifted { opacity: .25; }
  .pz-slot .pz-piece { pointer-events: none; }      /* touches go to the slot underneath */
  /* Classic jigsaw pieces: transparent outside the outline, so shadows follow the shape */
  #puzzleScreen.jig #pzBoard { gap: 0; }
  #puzzleScreen.jig .pz-slot { border: 0; border-radius: 0; box-shadow: inset 0 0 0 1px #ffc6df; }
  #puzzleScreen.jig .pz-slot.filled { box-shadow: none; }
  #puzzleScreen.jig .pz-piece { box-shadow: none; border-radius: 0; filter: drop-shadow(0 3px 2px rgba(74,43,60,.3)); }
  #puzzleScreen.jig .pz-slot .pz-piece { filter: none; }
  #puzzleScreen.jig .pz-piece.sel { outline: none; filter: drop-shadow(0 0 3px #ff5fa2) drop-shadow(0 0 3px #ff5fa2); }
  .pz-ghost.jig { box-shadow: none; border-radius: 0; filter: drop-shadow(0 12px 14px rgba(0,0,0,.35)); }
  .pill { font-size: 18px; padding: 0 18px; }
  .pz-side.over { box-shadow: 0 0 0 5px var(--pink), 0 10px 24px #d93f8222; }
  .pz-slot { position: relative; border-radius: 10px; background: #fff4f9; border: 2px dashed #ffc6df; }
  .pz-slot.filled { border: 0; }
  .pz-slot.over { background: #ffe1ee; border-color: var(--pink); }
  .pz-slot .pz-piece { position: absolute; inset: 0; width: 100%; height: 100%; box-shadow: none; border-radius: 6px; z-index: 1; }
  .pz-side {
    width: calc(340px * var(--ui, 1)); flex: none; display: flex; flex-direction: column; gap: 12px;
    background: #fff; border-radius: 26px; padding: 12px; box-shadow: 0 6px 0 var(--pink-line), 0 10px 24px #d93f8222;
  }
  #pzModel { width: 100%; aspect-ratio: 4/3; border-radius: 16px; object-fit: cover; display: block; box-shadow: 0 0 0 4px #ffe1ee; }
  #pzModel[hidden] { display: none; }
  #pzTray { flex: 1; min-height: 0; display: grid; gap: 10px; align-content: start; justify-content: center; padding: 4px; }
  .pz-piece {
    border-radius: 8px; background-repeat: no-repeat; touch-action: none; cursor: grab;
    box-shadow: 0 4px 0 #f0a3c6, 0 6px 10px #0002; transition: opacity .15s;
  }
  .pz-piece.sel { outline: 5px solid var(--pink); outline-offset: 2px; }
  .pz-piece.lifted { opacity: .25; }
  .pz-piece.gone { visibility: hidden; }
  .pz-ghost {
    position: fixed; z-index: 30; pointer-events: none; border-radius: 8px; background-repeat: no-repeat;
    transform: translate(-50%, -50%) scale(1.06); box-shadow: 0 14px 34px #0005;
  }
  .shake { animation: shake .45s; }
  @keyframes shake { 20% { transform: translateX(-9px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
  .pop { animation: pop .35s; }
  @keyframes pop { 50% { transform: scale(1.08); } }
  #pzWin { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: #4a2b3c55; }
  #pzWin[hidden] { display: none; }
  #confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .win-card {
    position: relative; z-index: 1; background: #fff; border-radius: 34px; padding: 26px 34px; text-align: center;
    box-shadow: 0 8px 0 var(--pink-line), 0 20px 50px #0003; animation: pop .5s;
  }
  .win-card .big { font-size: 80px; line-height: 1; }
  .win-card h2 { margin: 6px 0 14px; font-size: 38px; font-weight: 900; color: var(--pink); }
  .win-card .row { justify-content: center; }
  #pzPrev {
    display: block; margin: 0 auto; width: auto; height: auto; max-width: 100%; max-height: 42vh;
    border-radius: 16px; touch-action: none; cursor: move;
  }

  /* ---------- Dialogs ---------- */
  dialog {
    border: 0; border-radius: 30px; padding: 22px; max-width: min(580px, 94vw); width: 100%;
    color: var(--ink); font-family: inherit; box-shadow: 0 8px 0 var(--pink-line), 0 20px 50px #0003;
  }
  dialog::backdrop { background: #4a2b3c77; }
  dialog h2 { margin: 0 0 12px; font-weight: 900; }
  .row { display: flex; justify-content: flex-end; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  .btn {
    padding: 12px 24px; border-radius: 18px; font-weight: 900; font-size: 18px; background: var(--pink-soft);
    box-shadow: 0 4px 0 var(--pink-line);
  }
  .btn.primary { background: var(--pink); color: #fff; box-shadow: 0 4px 0 var(--pink-dark); }
  .btn:active { transform: translateY(3px); box-shadow: none; }

  #prev {
    display: block; margin: 0 auto; width: auto; height: auto; max-width: 100%; max-height: 40vh;
    background: #fff; border: 3px solid var(--pink-line); border-radius: 16px; touch-action: none; cursor: crosshair;
  }
  .crop-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; min-height: 40px; font-size: 15px; color: var(--muted); font-weight: 800; }
  .crop-bar .btn { padding: 6px 14px; font-size: 14px; white-space: nowrap; }
  .crop-btns { display: flex; gap: 8px; }
  .seg { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  .seg label { flex: 1; padding: 10px; border-radius: 16px; background: var(--pink-soft); font-weight: 900; cursor: pointer; text-align: center; min-width: 150px; }
  .seg input { display: none; }
  .seg label:has(input:checked) { background: var(--pink); color: #fff; }
  .field { display: grid; gap: 6px; margin: 10px 0; font-weight: 900; font-size: 15px; }
  .field input[type=text], .field input[type=password] { font: inherit; font-weight: 700; padding: 10px 14px; border-radius: 16px; border: 3px solid var(--pink-line); }
  .field input[type=range] { accent-color: var(--pink); }

  #colorDlg { max-width: min(640px, 96vw); }
  .pick-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .pick-head h2 { margin: 0; }
  .xbtn { width: 46px; height: 46px; border-radius: 50%; background: var(--pink-soft); font-size: 22px; font-weight: 900; color: var(--pink-dark); }
  #cgrid { display: grid; grid-template-columns: repeat(12, 1fr); border-radius: 16px; overflow: hidden; box-shadow: 0 0 0 3px var(--pink-soft); }
  #cgrid button { aspect-ratio: 1; }
  #cgrid button.on { box-shadow: inset 0 0 0 4px #fff, inset 0 0 0 7px var(--ink); }
  .pick-foot { display: flex; align-items: center; gap: 18px; margin-top: 18px; }
  #curBig { width: 76px; height: 76px; border-radius: 20px; flex: none; box-shadow: inset 0 0 0 2px #0001; }
  .pick-foot small { display: block; font-weight: 800; color: var(--muted); margin-bottom: 6px; }
  #recent { display: flex; gap: 10px; flex-wrap: wrap; min-height: 46px; }
  #recent button { width: 46px; height: 46px; border-radius: 50%; box-shadow: inset 0 0 0 2px #0001; }

  #drop { position: fixed; inset: 0; background: #ff5fa2cc; color: #fff; font-size: 40px; font-weight: 900;
    display: none; place-items: center; z-index: 10; pointer-events: none; }
  body.dragging #drop { display: grid; }
  #busy {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); z-index: 20;
    background: var(--ink); color: #fff; padding: 12px 24px 12px 52px; border-radius: 999px;
    font-weight: 800; display: none; box-shadow: 0 6px 24px #0003;
  }
  #busy::before {
    content: ""; position: absolute; left: 18px; top: 50%; width: 20px; height: 20px; margin-top: -10px;
    border: 3px solid #fff5; border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  body.busy #busy { display: block; }

  #printImg { display: none; }
  @media print {
    @page { margin: 10mm; }
    body { background: #fff; height: auto; overflow: visible; }
    body > *:not(#printImg) { display: none !important; }
    #printImg { display: block; width: 100%; height: auto; }
  }

</style>
</head>
<body data-screen="home">

<!-- ================= HOME ================= -->
<section id="home">
  <div class="logo"><h1>Color<span>AVI</span></h1><p id="tagline">¿Qué quieres pintar hoy?</p></div>
  <div class="modes">
    <button class="mode on" data-mode="color">🖍️ Colorear</button>
    <button class="mode" data-mode="puzzle">🧩 Rompecabezas</button>
  </div>
  <div id="grid">
    <button class="dcard add" id="addBtn"><big>＋</big>Subir dibujo</button>
  </div>
  <div id="pzGrid" hidden>
    <button class="dcard add" id="pzAdd"><big>＋</big>Subir imagen</button>
  </div>
</section>

<!-- ================= PUZZLE ================= -->
<section id="puzzleScreen">
  <div class="topbar">
    <div class="group">
      <button class="rbtn pink" id="pzHome" title="Mis rompecabezas">
        <svg viewBox="0 0 64 64"><path d="M10 31 32 12l22 19" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 29v21a3 3 0 0 0 3 3h24a3 3 0 0 0 3-3V29L32 16z" fill="#fff"/><rect x="27" y="38" width="10" height="15" rx="3" fill="#ff5fa2"/></svg>
      </button>
    </div>
    <div class="chips" id="pzCount"><span>🧩</span></div>
    <div class="group">
      <button class="pill on" id="pzShapeBtn" title="Piezas con forma de ficha">🧩 Fichas</button>
      <button class="pill on" id="pzModelBtn">👀 Modelo</button>
      <button class="pill" id="pzGuideBtn">✨ Guía</button>
      <button class="rbtn" id="pzShuffle" title="Mezclar de nuevo">
        <svg viewBox="0 0 64 64"><path d="M8 20h10c10 0 14 24 26 24h10M8 44h10c5 0 8-6 11-12m6-6c3-4 6-6 9-6h10" fill="none" stroke="#ff5fa2" stroke-width="6" stroke-linecap="round"/><path d="M48 12l8 8-8 8M48 36l8 8-8 8" fill="none" stroke="#ff5fa2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
  <div class="pz-main">
    <div class="pz-boardwrap"><div id="pzBoard"></div></div>
    <aside class="pz-side">
      <img id="pzModel" alt="Modelo">
      <div id="pzTray"></div>
    </aside>
  </div>
  <div id="pzWin" hidden>
    <canvas id="confetti"></canvas>
    <div class="win-card">
      <div class="big">🎉</div>
      <h2>¡Lo lograste!</h2>
      <div class="row">
        <button class="btn primary" id="pzAgain">Otra vez</button>
        <button class="btn" id="pzOther">Elegir otro</button>
      </div>
    </div>
  </div>
</section>

<!-- ================= PAINT ================= -->
<section id="paintScreen">
  <div class="topbar">
    <div class="group">
      <button class="rbtn pink" id="homeBtn" title="Mis dibujos">
        <svg viewBox="0 0 64 64"><path d="M10 31 32 12l22 19" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 29v21a3 3 0 0 0 3 3h24a3 3 0 0 0 3-3V29L32 16z" fill="#fff"/><rect x="27" y="38" width="10" height="15" rx="3" fill="#ff5fa2"/></svg>
      </button>
      <button class="rbtn" id="undo" title="Deshacer">
        <svg viewBox="0 0 64 64"><path d="M24 14 11 27l13 13" fill="none" stroke="#ff5fa2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 27h24a14 14 0 0 1 0 28H28" fill="none" stroke="#ff5fa2" stroke-width="7" stroke-linecap="round"/></svg>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  const mk = (w, h) => Object.assign(document.createElement('canvas'), { width: w, height: h });
  const rgb = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  // In-app yes/no dialog (native confirm() is blocked in some embedded browsers)
  const ask = msg => new Promise(res => {
    const d = $('#askDlg');
    $('#askMsg').textContent = msg;
    d.returnValue = '';
    d.addEventListener('close', () => res(d.returnValue === 'yes'), { once: true });
    d.showModal();
  });

  const CRAYONS = ['#e53935','#fb8c00','#fdd835','#7cb342','#2e7d32','#4fc3f7','#1e88e5','#7e57c2',
                   '#ec407a','#ff9cc8','#f6c9a8','#8d6e63','#9e9e9e','#212121','#ffffff'];
  const SIZES = [10, 22, 44];          // stroke width per 1000 px of drawing width

  const state = { id: null, w: 0, h: 0, tool: 'fill', color: '#e53935', size: 1, stayIn: true, pan: false, zoom: 1, fit: 1 };
  let order = [];                      // drawing ids, oldest first (for the arrows)
  const viewport = $('#viewport'), board = $('#board');
  const paint = $('#paint'), live = $('#live'), lines = $('#lines');
  const pctx = paint.getContext('2d', { willReadFrequently: true });
  const lctx = live.getContext('2d');
  const linesCtx = lines.getContext('2d', { willReadFrequently: true });
  let wall = null;                 // Uint8Array: 1 = line pixel (barrier for fills)
  let undoStack = [], redoStack = [];
  const UNDO_MAX = 6;      // up to ~12 MB per step at 2048 px; kept low for iPads with little memory
  const MAX_SIZE = 2048;   // longest side of a drawing, in pixels

  // ---------- IndexedDB ----------
  // Stores: 'dibujos' (coloring pages) and 'puzzles' (4:3 color images)
  let db, mem = null;   // mem: in-memory fallback when IndexedDB is unavailable
  const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const store = (s, mode) => db.transaction(s, mode).objectStore(s);
  async function openDB() {
    try {
      const r = indexedDB.open('colorear', 2);
      r.onupgradeneeded = () => {
        for (const s of ['dibujos', 'puzzles']) if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s, { keyPath: 'id' });
      };
      db = await reqP(r);
    } catch { mem = { dibujos: new Map(), puzzles: new Map() }; }
  }
  const getAll = async (s = 'dibujos') => mem ? [...mem[s].values()] : reqP(store(s, 'readonly').getAll());
  const getRec = async (id, s = 'dibujos') => mem ? mem[s].get(id) : reqP(store(s, 'readonly').get(id));
  const putRec = async (rec, s = 'dibujos') => mem ? mem[s].set(rec.id, rec) : reqP(store(s, 'readwrite').put(rec));
  const delRec = async (id, s = 'dibujos') => mem ? mem[s].delete(id) : reqP(store(s, 'readwrite').delete(id));

  const toBlob = c => new Promise(r => c.toBlob(r, 'image/png'));
  const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

  // ---------- Image -> line art ----------
  // In-place box blur on a grayscale buffer (ctx.filter is missing on older iPadOS)
  function boxBlur(g, w, h, r) {
    const tmp = new Float32Array(g.length), d = 2 * r + 1;
    for (let y = 0; y < h; y++) {
      const o = y * w;
      let s = 0;
      for (let x = -r; x <= r; x++) s += g[o + Math.min(w - 1, Math.max(0, x))];
      for (let x = 0; x < w; x++) {
        tmp[o + x] = s / d;
        s += g[o + Math.min(w - 1, x + r + 1)] - g[o + Math.max(0, x - r)];
      }
    }
    for (let x = 0; x < w; x++) {
      let s = 0;
      for (let y = -r; y <= r; y++) s += tmp[Math.min(h - 1, Math.max(0, y)) * w + x];
      for (let y = 0; y < h; y++) {
        g[y * w + x] = s / d;
        s += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x];
      }
    }
  }

  // Drop tiny specks (photo grain): connected bits smaller than ~0.005% of the image
  function removeSpecks(o, w, h) {
    const n = w * h, minPx = Math.max(12, n / 20000), seen = new Uint8Array(n), stack = new Int32Array(n), comp = [];
    for (let s = 0; s < n; s++) {
      if (seen[s] || !o[s * 4 + 3]) continue;
      let sp = 0; stack[sp++] = s; seen[s] = 1; comp.length = 0;
      while (sp) {
        const i = stack[--sp], cx = i % w;
        comp.push(i);
        for (const j of [cx > 0 ? i - 1 : -1, cx < w - 1 ? i + 1 : -1, i - w, i + w]) {
          if (j >= 0 && j < n && !seen[j] && o[j * 4 + 3]) { seen[j] = 1; stack[sp++] = j; }
        }
      }
      if (comp.length < minPx) for (const i of comp) o[i * 4 + 3] = 0;
    }
  }

  // Returns a canvas where lines are dark with alpha and everything else is transparent.
  // crop (optional) is a rectangle in source pixels.
  // Grey-level dilation (max) or erosion (min) with a (2r+1)² square, done as two 1-D passes
  function morph(a, w, h, r, isMax) {
    const t = new Float32Array(a.length), o = new Float32Array(a.length);
    for (let y = 0; y < h; y++) {
      const row = y * w;
      for (let x = 0; x < w; x++) {
        let v = a[row + x];
        const x1 = Math.min(w - 1, x + r);
        for (let k = Math.max(0, x - r); k <= x1; k++) { const u = a[row + k]; if (isMax ? u > v : u < v) v = u; }
        t[row + x] = v;
      }
    }
    for (let x = 0; x < w; x++) {
      for (let y = 0; y < h; y++) {
        let v = t[y * w + x];
        const y1 = Math.min(h - 1, y + r);
        for (let k = Math.max(0, y - r); k <= y1; k++) { const u = t[k * w + x]; if (isMax ? u > v : u < v) v = u; }
        o[y * w + x] = v;
      }
    }
    return o;
  }

  // Colour illustration with black outlines -> clean coloring lines (w×h output).
  // Keeps thin dark outlines (black top-hat: big dark areas like a black dog are NOT filled)
  // and adds a line wherever the flat colour changes, so every region is closed.
  // Works on a ≤900 px copy for speed, then scales up and re-sharpens the lines.
  function illusLines(img, cr, w, h, t) {
    const s = Math.min(1, 900 / Math.max(w, h));
    const sw = Math.max(1, Math.round(w * s)), sh = Math.max(1, Math.round(h * s)), n = sw * sh;
    const sc = mk(sw, sh), sx = sc.getContext('2d', { willReadFrequently: true });
    sx.fillStyle = '#fff'; sx.fillRect(0, 0, sw, sh);
    sx.imageSmoothingQuality = 'high';
    sx.drawImage(img, cr.x, cr.y, cr.w, cr.h, 0, 0, sw, sh);
    const p = sx.getImageData(0, 0, sw, sh).data;
    const R = new Float32Array(n), G = new Float32Array(n), B = new Float32Array(n), g = new Float32Array(n);
    for (let i = 0; i < n; i++) { R[i] = p[i*4]; G[i] = p[i*4+1]; B[i] = p[i*4+2]; g[i] = .299 * R[i] + .587 * G[i] + .114 * B[i]; }
    // 1) thin dark outlines: closing(g) - g is big only on dark strokes narrower than the window
    const r = Math.max(2, Math.round(Math.max(sw, sh) / 90));
    const closed = morph(morph(g, sw, sh, r, true), sw, sh, r, false);
    const thTop = 50 - t * .35;                     // slider: lower threshold = more lines
    // 2) colour borders between flat regions (on a lightly smoothed copy to ignore anti-aliasing)
    for (const ch of [R, G, B]) boxBlur(ch, sw, sh, 1);
    const T = 62 - t * .5, edge = new Uint8Array(n);
    for (let y = 0; y < sh - 1; y++) for (let x = 0; x < sw - 1; x++) {
      const i = y * sw + x, a = i + 1, b = i + sw;
      const d = Math.max(Math.abs(R[i] - R[a]), Math.abs(G[i] - G[a]), Math.abs(B[i] - B[a]),
                         Math.abs(R[i] - R[b]), Math.abs(G[i] - G[b]), Math.abs(B[i] - B[b]));
      if (d > T) edge[i] = 1;
    }
    const sm = sx.createImageData(sw, sh), o = sm.data;
    for (let i = 0; i < n; i++) {
      const top = closed[i] - g[i];
      const a = edge[i] ? 255 : Math.max(0, Math.min(255, (top - thTop) / (thTop * .6 + 1) * 255));
      o[i*4] = 34; o[i*4+1] = 30; o[i*4+2] = 46; o[i*4+3] = a;
    }
    removeSpecks(o, sw, sh);
    sx.putImageData(sm, 0, 0);
    // scale up to the drawing size and re-sharpen the soft edges
    const c = mk(w, h), x = c.getContext('2d', { willReadFrequently: true });
    x.imageSmoothingQuality = 'high';
    x.drawImage(sc, 0, 0, w, h);
    const big = x.getImageData(0, 0, w, h), q = big.data;
    for (let i = 3; i < q.length; i += 4) q[i] = Math.max(0, Math.min(255, (q[i] - 70) * 2.5));
    x.putImageData(big, 0, 0);
    return c;
  }

  function convert(img, mode, t, max, crop) {
    const cr = crop || { x: 0, y: 0, w: img.naturalWidth || img.width, h: img.naturalHeight || img.height };
    // shrink big images; small ones are enlarged (up to 1200 px) so the lines come out smooth
    const long = Math.max(cr.w, cr.h);
    const k = long > max ? max / long : (max >= 1200 && long < 1200 ? 1200 / long : 1);
    const w = Math.max(1, Math.round(cr.w * k)), h = Math.max(1, Math.round(cr.h * k));
    if (mode === 'illus') return illusLines(img, cr, w, h, t);
    const c = mk(w, h), x = c.getContext('2d', { willReadFrequently: true });
    x.imageSmoothingQuality = 'high';
    x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
    x.drawImage(img, cr.x, cr.y, cr.w, cr.h, 0, 0, w, h);
    const d = x.getImageData(0, 0, w, h), p = d.data, n = w * h;
    const g = new Float32Array(n);
    for (let i = 0; i < n; i++) g[i] = .299 * p[i * 4] + .587 * p[i * 4 + 1] + .114 * p[i * 4 + 2];
    const out = x.createImageData(w, h), o = out.data;
    if (mode === 'photo') {
      const r = Math.max(1, Math.round(w / 500));
      boxBlur(g, w, h, r); boxBlur(g, w, h, r);
      const M = new Float32Array(n);
      let top = 0;
      for (let y = 1; y < h - 1; y++) for (let xx = 1; xx < w - 1; xx++) {

      for (let i = 0; i < n; i++) o[i * 4 + 3] = Math.max(0, Math.min(255, (D[i] - thr) / (thr * .5 + 1) * 255));

  }

  // ---------- Drawing load / save ----------
  function composite(scale = 1) {
    const c = mk(Math.round(state.w * scale), Math.round(state.h * scale)), x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);

  }

  function showScreen(name) {
    document.body.dataset.screen = name;

    if (name === 'puzzle') requestAnimationFrame(layoutPuzzle);
  }
  function setHomeTab(mode) {
    homeTab = mode;
    lsSet('colorear.tab', mode);
    $$('.mode').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
    $('#grid').hidden = mode !== 'color';
    $('#pzGrid').hidden = mode !== 'puzzle';
    $('#tagline').textContent = mode === 'color' ? '¿Qué quieres pintar hoy?' : '¿Qué rompecabezas armamos?';
  }
  let homeTab = 'color';
  $$('.mode').forEach(b => b.onclick = () => setHomeTab(b.dataset.mode));

  async function openDrawing(id) {
    const rec = await getRec(id);
    if (!rec) return;
    state.id = id; state.w = rec.w; state.h = rec.h;
    for (const c of [paint, live, lines]) { c.width = rec.w; c.height = rec.h; }
    const li = await loadImg(URL.createObjectURL(rec.line));
    linesCtx.drawImage(li, 0, 0);
    if (rec.paint) pctx.drawImage(await loadImg(URL.createObjectURL(rec.paint)), 0, 0);
    const a = linesCtx.getImageData(0, 0, rec.w, rec.h).data;
    wall = new Uint8Array(rec.w * rec.h);
    for (let i = 0; i < wall.length; i++) wall[i] = a[i * 4 + 3] > 110 ? 1 : 0;
    undoStack = []; redoStack = []; updateUndo();
    if (rec.photo) { delete rec.photo; putRec(rec); }   // drop photos saved by the old AI mode
    lsSet('colorear.last', id);
    showScreen('paint');
  }

  let saveTimer;
  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 700);
  }
  async function save() {
    clearTimeout(saveTimer);
    if (!state.id) return;
    const rec = await getRec(state.id);
    if (!rec) return;
    rec.paint = await toBlob(paint);
    rec.thumb = composite(320 / state.w).toDataURL('image/jpeg', .85);
    await putRec(rec);
  }

  async function addDrawing(lineCanvas, name, open = true) {
    const id = 'd' + Date.now() + Math.random().toString(36).slice(2, 6);
    const th = mk(320, Math.round(320 * lineCanvas.height / lineCanvas.width)), tx = th.getContext('2d');
    tx.fillStyle = '#fff'; tx.fillRect(0, 0, th.width, th.height);
    tx.drawImage(lineCanvas, 0, 0, th.width, th.height);
    await putRec({ id, name, created: Date.now(), w: lineCanvas.width, h: lineCanvas.height,
      line: await toBlob(lineCanvas), paint: null, thumb: th.toDataURL('image/jpeg', .85) });
    await renderGallery();
    if (open) await openDrawing(id);
  }

  async function renderGallery() {
    const recs = (await getAll()).sort((a, b) => a.created - b.created);
    order = recs.map(r => r.id);
    const grid = $('#grid');
    $$('#grid .dcard[data-id]').forEach(c => c.remove());
    for (const r of recs) {
      const card = document.createElement('div');
      card.className = 'dcard';
      card.dataset.id = r.id;
      card.innerHTML = `<img alt=""><span class="name"></span><button class="del" title="Borrar">✕</button>`;
      card.querySelector('img').src = r.thumb;
      card.querySelector('.name').textContent = r.name;
      card.onclick = e => { if (!e.target.closest('.del')) openDrawing(r.id); };
      card.querySelector('.del').onclick = async () => {
        if (!await ask(`¿Borrar "${r.name}"?`)) return;
        await delRec(r.id);
        if (r.id === state.id) state.id = null;
        const left = await renderGallery();
        if (!left.length) await addSample();
      };
      grid.appendChild(card);
    }
    $('#prevBtn').hidden = $('#nextBtn').hidden = recs.length < 2;
    return recs;
  }

  async function goHome() {
    await save();
    await renderGallery();
    setHomeTab('color');
    showScreen('home');
  }
  async function step(dir) {
    if (order.length < 2) return;
    await save();
    const i = order.indexOf(state.id);
    openDrawing(order[(i + dir + order.length) % order.length]);
  }

  // ---------- Undo ----------
  function pushUndo() {
    undoStack.push(pctx.getImageData(0, 0, state.w, state.h));

    updateUndo();
  }
  function updateUndo() { $('#undo').disabled = !undoStack.length; $('#redo').disabled = !redoStack.length; }
  function undo() {
    if (!undoStack.length) return;
    redoStack.push(pctx.getImageData(0, 0, state.w, state.h));
    pctx.putImageData(undoStack.pop(), 0, 0);
    updateUndo(); scheduleSave();
  }
  function redo() {
    if (!redoStack.length) return;
    undoStack.push(pctx.getImageData(0, 0, state.w, state.h));
    pctx.putImageData(redoStack.pop(), 0, 0);
    updateUndo(); scheduleSave();
  }

  // ---------- Regions ----------
  // Flood-fills the line-art barrier map from (sx,sy); grows 3px under the lines so no white halo remains.
  function region(sx, sy) {
    const { w, h } = state, n = w * h, start = sy * w + sx;
    if (wall[start]) return null;
    const R = new Uint8Array(n), stack = new Int32Array(n);
    let sp = 0; stack[sp++] = start; R[start] = 1;
    while (sp) {

      if (x < w - 1 && !R[i + 1] && !wall[i + 1]) { R[i + 1] = 1; stack[sp++] = i + 1; }
      if (i >= w && !R[i - w] && !wall[i - w]) { R[i - w] = 1; stack[sp++] = i - w; }
      if (i < n - w && !R[i + w] && !wall[i + w]) { R[i + w] = 1; stack[sp++] = i + w; }

    for (let pass = 2; pass <= 4; pass++) {

    return R;
  }

  function fillAt(x, y) {
    const R = region(x, y);
    if (!R) return;
    pushUndo();
    const img = pctx.getImageData(0, 0, state.w, state.h), d = img.data;
    const [r, g, b] = rgb(state.color);
    for (let i = 0; i < R.length; i++) if (R[i]) { d[i*4] = r; d[i*4+1] = g; d[i*4+2] = b; d[i*4+3] = 255; }

    scheduleSave();
  }

  function maskCanvas(R) {

  }

  // ---------- Brush textures ----------
  const scaleK = () => state.w / 1000;

  function rollerPattern(ctx, hex) {
    const k = scaleK(), s = Math.round(60 * k), c = mk(s, s), x = c.getContext('2d');
    x.globalAlpha = .3; x.fillStyle = hex; x.fillRect(0, 0, s, s); x.globalAlpha = 1;

    const spots = [[.25, .25], [.75, .75], [.75, .25], [.25, .75]];

  // ---------- Strokes ----------
  let stroke = null;   // { ctx, mask, last, eraser }
  let rafPending = false;

  function startStroke(p) {

    pushUndo();

    if (!eraser && state.stayIn) {
      const R = region(p.x | 0, p.y | 0);
      if (R) mask = maskCanvas(R);
    }
    const target = eraser ? pctx : mk(state.w, state.h).getContext('2d');

  }
  function renderLive() {

    lctx.clearRect(0, 0, state.w, state.h);

  }
  function endStroke(commit) {

      if (!commit) { pctx.putImageData(undoStack.pop(), 0, 0); updateUndo(); }
    } else {
      renderLive();
      if (commit) pctx.drawImage(live, 0, 0);
      else { undoStack.pop(); updateUndo(); }
      lctx.clearRect(0, 0, state.w, state.h);

  // ---------- Pointer handling (no pinch: a second finger just cancels the stroke) ----------
  const pointers = new Set();
  let pan = null;
  function toCanvas(e) {
    const r = lines.getBoundingClientRect();
    return { x: (e.clientX - r.left) * state.w / r.width, y: (e.clientY - r.top) * state.h / r.height };
  }

    if (pointers.size > 1) { endStroke(false); pan = null; return; }
    if (state.pan || e.button === 1) {
      pan = { x: e.clientX, y: e.clientY, sl: viewport.scrollLeft, st: viewport.scrollTop };
      return;
    }

    if (!pointers.has(e.pointerId) || pointers.size > 1) return;

  // ---------- Zoom (buttons only) ----------
  function setZoom(z) {

    const s = state.fit * z;
    board.style.width = state.w * s + 'px';
    board.style.height = state.h * s + 'px';
    viewport.scrollLeft = cx * viewport.scrollWidth - viewport.clientWidth / 2;
    viewport.scrollTop = cy * viewport.scrollHeight - viewport.clientHeight / 2;
    $('#zout').disabled = z <= 1;
    if (z <= 1 && state.pan) setPan(false);
  }
  function fitZoom() {

  // ---------- Colors ----------
  function hslHex(h, s, l) {

  let recent = [];

      <path d="M13 42 25 8q5-7 10 0l12 34z" fill="${fill}"${edge}/>
      <rect x="9" y="40" width="42" height="104" rx="8" fill="${fill}"${edge}/>
      <rect x="9" y="62" width="42" height="34" fill="#fff" opacity=".9"/>
      <rect x="9" y="67" width="42" height="5" fill="${fill}"/><rect x="9" y="86" width="42" height="5" fill="${fill}"/>

  }
  function renderCrayons() {

  }
  function markColor() {

  // Downscale once so the preview and final conversion never touch the full-size original again
  function shrink(img, max) {

  // Paints the converted preview plus the crop box (crop is stored as 0..1 fractions)
  function drawPreview() {
    const c = current?.preview;
    if (!c) return;
    if (prev.width !== c.width || prev.height !== c.height) { prev.width = c.width; prev.height = c.height; }
    const x = prev.getContext('2d'), W = c.width, H = c.height;
    x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); x.drawImage(c, 0, 0);

  function pieceBg(el, i) {
    if (pz.jig) {                                   // jigsaw pieces are pre-cut images
      el.style.backgroundImage = `url(${pz.shapes[i]})`;
      el.style.backgroundSize = '100% 100%';

  // ----- classic jigsaw pieces -----
  // One side of a piece, drawn clockwise from p0 to p1. s: 1 = tab out, -1 = hole in, 0 = flat border.
  function jigEdge(x, [x0, y0], [x1, y1], s, S) {
    if (!s) { x.lineTo(x1, y1); return; }
    const len = Math.hypot(x1 - x0, y1 - y0), dx = (x1 - x0) / len, dy = (y1 - y0) / len;
    const P = (u, v) => [x0 + dx * u * len + dy * v * S * s, y0 + dy * u * len - dx * v * S * s];
    x.lineTo(...P(.35, 0));
    x.bezierCurveTo(...P(.40, 0), ...P(.43, .09), ...P(.39, .15));
    x.bezierCurveTo(...P(.33, .24), ...P(.40, .30), ...P(.50, .30));
    x.bezierCurveTo(...P(.60, .30), ...P(.67, .24), ...P(.61, .15));
    x.bezierCurveTo(...P(.57, .09), ...P(.60, 0), ...P(.65, 0));
    x.lineTo(x1, y1);
  }
  // Cuts every piece (cell + margin m for the tabs) into its own image
  async function buildShapes() {
    const { cols, rows, img } = pz, n = cols * rows;
    const cw = img.naturalWidth / cols, ch = img.naturalHeight / rows, S = Math.min(cw, ch), m = Math.ceil(S * .32);
    pz.geom = { cw, ch, m };
    const rnd = () => Math.random() < .5 ? 1 : -1;
    // H[r][c]: edge above row r (+1 = the piece above has the tab); V[r][c]: edge left of column c
    const H = Array.from({ length: rows + 1 }, (_, r) => Array.from({ length: cols }, () => r === 0 || r === rows ? 0 : rnd()));
    const V = Array.from({ length: rows }, () => Array.from({ length: cols + 1 }, (_, c) => c === 0 || c === cols ? 0 : rnd()));
    (pz.shapes || []).forEach(u => URL.revokeObjectURL(u));
    pz.shapes = await Promise.all([...Array(n).keys()].map(i => {
      const c = i % cols, r = i / cols | 0;
      const cv = mk(Math.ceil(cw + 2 * m), Math.ceil(ch + 2 * m)), x = cv.getContext('2d');
      const tl = [m, m], tr = [m + cw, m], br = [m + cw, m + ch], bl = [m, m + ch];
      x.beginPath(); x.moveTo(...tl);
      jigEdge(x, tl, tr, -H[r][c], S);
      jigEdge(x, tr, br, V[r][c + 1], S);
      jigEdge(x, br, bl, H[r + 1][c], S);
      jigEdge(x, bl, tl, -V[r][c], S);
      x.closePath();
      x.save(); x.clip();
      x.drawImage(img, m - c * cw, m - r * ch);
      x.restore();
      x.lineWidth = Math.max(2, S * .012); x.strokeStyle = 'rgba(74,43,60,.35)'; x.stroke();
      return new Promise(res => cv.toBlob(b => res(URL.createObjectURL(b)), 'image/png'));
    }));
  }
  // Size of a piece element relative to its cell (jigsaw pieces stick out for their tabs)
  const pieceScale = () => pz.jig && pz.geom ? { w: (pz.geom.cw + 2 * pz.geom.m) / pz.geom.cw, h: (pz.geom.ch + 2 * pz.geom.m) / pz.geom.ch } : { w: 1, h: 1 };

  async function newGame() {
    [pz.cols, pz.rows] = PZ_GRIDS[pz.count];
    const n = pz.cols * pz.rows;
    pz.board = Array(n).fill(null); pz.sel = null;
    clearDrag();
    $('#pzWin').hidden = true;
    const jig = lsGet('colorear.pzShape') !== 'rect';
    if (jig) { busy('Cortando las piezas…'); await buildShapes(); busy(); }
    pz.jig = jig;
    $('#puzzleScreen').classList.toggle('jig', jig);
    $('#pzShapeBtn').classList.toggle('on', jig);
    pzBoard.innerHTML = '';
    pzBoard.style.gridTemplateColumns = `repeat(${pz.cols}, 1fr)`;
    pzBoard.style.gridTemplateRows = `repeat(${pz.rows}, 1fr)`;
    for (let i = 0; i < n; i++) {
      const s = document.createElement('div');
      s.className = 'pz-slot'; s.dataset.i = i;
      pzBoard.appendChild(s);
    }
    // shuffled tray (never already in order)
    let order = [...Array(n).keys()];
    do { for (let i = n - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [order[i], order[j]] = [order[j], order[i]]; } }
    while (order.every((v, i) => v === i));
    pzTray.innerHTML = '';
    for (const i of order) {
      const p = document.createElement('div');
      p.className = 'pz-piece'; p.dataset.i = i;
      pieceBg(p, i);
      pzTray.appendChild(p);

    layoutPuzzle();

  // Board: biggest 4:3 that fits. Tray: column count that fits every piece without scrolling.
  function layoutPuzzle() {
    if (document.body.dataset.screen !== 'puzzle') return;
    const wrap = $('.pz-boardwrap').getBoundingClientRect();
    const bw = Math.min(wrap.width - 30, (wrap.height - 30) * 4 / 3);
    pzBoard.style.width = bw + 'px';
    pzBoard.style.height = bw * 3 / 4 + 'px';
    const t = pzTray.getBoundingClientRect(), gap = 10, n = pz.cols * pz.rows;
    const sc = pieceScale(), aspect = (4 / pz.cols * sc.w) / (3 / pz.rows * sc.h);   // piece width / height
    let best = 0, bestCols = 1;
    for (let c = 1; c <= 6; c++) {
      let w = Math.min(160, (t.width - 8 - gap * (c - 1)) / c);
      const rows = Math.ceil(n / c);
      const hMax = (t.height - 8 - gap * (rows - 1)) / rows;
      if (w / aspect > hMax) w = hMax * aspect;
      if (w > best) { best = w; bestCols = c; }
    }
    best = Math.max(30, Math.floor(best));
    pzTray.style.gridTemplateColumns = `repeat(${bestCols}, ${best}px)`;
    $$('#pzTray .pz-piece').forEach(p => { p.style.width = best + 'px'; p.style.height = best / aspect + 'px'; });
  }
  new ResizeObserver(layoutPuzzle).observe($('.pz-main'));

  function showModel(on) {
    $('#pzModel').hidden = !on;
    $('#pzModelBtn').classList.toggle('on', on);
    layoutPuzzle();
  }
  $('#pzModelBtn').onclick = () => showModel($('#pzModel').hidden);
  function showGuide(on) {
    pzBoard.classList.toggle('guide', on);
    $('#pzGuideBtn').classList.toggle('on', on);
  }
  $('#pzGuideBtn').onclick = () => showGuide(!pzBoard.classList.contains('guide'));
  $('#pzShuffle').onclick = newGame;
  $('#pzShapeBtn').onclick = () => { lsSet('colorear.pzShape', pz.jig ? 'rect' : 'jig'); newGame(); };
  $('#pzAgain').onclick = newGame;
  const pzGoHome = async () => { await renderPuzzles(); setHomeTab('puzzle'); showScreen('home'); };
  $('#pzHome').onclick = pzGoHome;
  $('#pzOther').onclick = pzGoHome;

  // ----- sounds (generated, so they work offline) -----
  let actx = null;
  function tones(freqs, dur = .1, type = 'sine') {
    try {
      actx ||= new (window.AudioContext || window.webkitAudioContext)();
      const t0 = actx.currentTime;
      freqs.forEach((f, k) => {
        const o = actx.createOscillator(), g = actx.createGain(), t = t0 + k * dur;
        o.type = type; o.frequency.value = f;
        g.gain.setValueAtTime(.0001, t);
        g.gain.exponentialRampToValueAtTime(.22, t + .02);
        g.gain.exponentialRampToValueAtTime(.0001, t + dur * 1.8);
        o.connect(g).connect(actx.destination);
        o.start(t); o.stop(t + dur * 2);
      });
    } catch {}
  }

  // ----- placing pieces (any piece can go anywhere; it's a win only when every piece is home) -----
  const slotEls = () => [...pzBoard.children];
  const trayEl = i => pzTray.querySelector(`.pz-piece[data-i="${i}"]`);
  // Element that shows a piece coming from the tray or from a slot
  const srcEl = (i, from) => from === 'tray' ? trayEl(i) : slotEls()[from]?.querySelector('.pz-piece');

  function renderBoard(popSlot = -1) {
    slotEls().forEach((s, t) => {
      const i = pz.board[t];
      s.classList.toggle('filled', i != null);
      s.classList.remove('pop');
      s.querySelector('.pz-piece')?.remove();
      if (i == null) return;
      const p = document.createElement('div');
      p.className = 'pz-piece'; p.dataset.i = i;
      pieceBg(p, i);
      if (pz.jig) {                               // let the tabs reach over the neighbouring cells
        const { cw, ch, m } = pz.geom;
        Object.assign(p.style, { left: -m / cw * 100 + '%', top: -m / ch * 100 + '%',
          width: (cw + 2 * m) / cw * 100 + '%', height: (ch + 2 * m) / ch * 100 + '%' });
      }
      s.appendChild(p);
      if (t === popSlot) { void s.offsetWidth; s.classList.add('pop'); }
    });
    $$('#pzTray .pz-piece').forEach(p => p.classList.toggle('gone', pz.board.includes(+p.dataset.i)));
    if (pz.sel) srcEl(pz.sel.i, pz.sel.from)?.classList.add('sel');
  }
  function selectPiece(sel) {
    $$('#puzzleScreen .pz-piece.sel').forEach(p => p.classList.remove('sel'));
    pz.sel = sel;
    if (sel) srcEl(sel.i, sel.from)?.classList.add('sel');
  }
  // Put piece i (coming from the tray or from slot `from`) into slot t; whatever was there goes back to the tray
  function placeAt(i, from, t) {
    if (from === t) return;
    if (from !== 'tray') pz.board[from] = null;
    pz.board[t] = i;
    pz.sel = null;
    renderBoard(t);
    const n = pz.board.length;
    if (pz.board.every((v, k) => v === k)) { tones([523, 659, 784, 1047], .14); setTimeout(win, 450); return; }
    if (pz.board.every(v => v != null)) {           // full but with mistakes: wiggle the wrong ones
      tones([300, 240], .14, 'triangle');
      slotEls().forEach((s, k) => { if (pz.board[k] !== k) { const p = s.querySelector('.pz-piece'); p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake'); } });
      return;
    }
    tones(i === t ? [660, 990] : [520], .08);
  }
  function backToTray(from) {
    if (from === 'tray') return;
    pz.board[from] = null;
    pz.sel = null;
    renderBoard();
    tones([440, 330], .07);
  }
  const slotAt = (x, y) => document.elementFromPoint(x, y)?.closest?.('.pz-slot');
  const overTray = (x, y) => !!document.elementFromPoint(x, y)?.closest?.('.pz-side');

  // A press on a piece (tray or board) or on an empty slot. Moving turns it into a drag;
  // a plain tap selects a piece, or drops the selected piece where you tap.
  // Only one finger drags at a time; every event is matched to that finger's pointerId,
  // and any leftover drag copies are swept away so none can stay stuck on screen
  let pdrag = null;
  function clearDrag() {
    pdrag = null;
    $$('.pz-ghost').forEach(g => g.remove());
    $$('#puzzleScreen .lifted').forEach(p => p.classList.remove('lifted'));
    $$('.pz-slot.over').forEach(s => s.classList.remove('over'));
    $('.pz-side').classList.remove('over');
  }
  function pressStart(e, i, from, slotIdx) {
    e.preventDefault();
    if (pdrag) return;                               // a second finger while dragging: ignore it
    clearDrag();
    pdrag = { id: e.pointerId, i, from, slotIdx, x: e.clientX, y: e.clientY, ghost: null, over: null, overTray: false };
  }
  addEventListener('blur', clearDrag);
  document.addEventListener('visibilitychange', () => { if (document.hidden) clearDrag(); });
  pzTray.addEventListener('pointerdown', e => {
    const p = e.target.closest('.pz-piece');
    if (p && !p.classList.contains('gone')) pressStart(e, +p.dataset.i, 'tray');
    else pressStart(e, null, null);                                      // tap on the tray background
  });
  pzBoard.addEventListener('pointerdown', e => {
    const s = e.target.closest('.pz-slot');
    if (!s) return;
    const t = slotEls().indexOf(s);
    pressStart(e, pz.board[t], pz.board[t] == null ? null : t, t);
  });
  addEventListener('pointermove', e => {
    if (!pdrag || pdrag.id !== e.pointerId || pdrag.i == null) return;
    if (!pdrag.ghost) {
      if (Math.hypot(e.clientX - pdrag.x, e.clientY - pdrag.y) < 8) return;
      const s = pzBoard.querySelector('.pz-slot').getBoundingClientRect();
      const g = pdrag.ghost = document.createElement('div');
      g.className = 'pz-ghost' + (pz.jig ? ' jig' : '');
      pieceBg(g, pdrag.i);
      const sc = pieceScale();
      g.style.width = s.width * sc.w + 'px'; g.style.height = s.height * sc.h + 'px';
      document.body.appendChild(g);
      srcEl(pdrag.i, pdrag.from)?.classList.add('lifted');
      selectPiece(null);
    }
    pdrag.ghost.style.left = e.clientX + 'px';
    pdrag.ghost.style.top = e.clientY + 'px';
    const over = slotAt(e.clientX, e.clientY);
    if (over !== pdrag.over) { pdrag.over?.classList.remove('over'); over?.classList.add('over'); pdrag.over = over; }
    const ot = pdrag.from !== 'tray' && overTray(e.clientX, e.clientY);
    if (ot !== pdrag.overTray) { $('.pz-side').classList.toggle('over', ot); pdrag.overTray = ot; }
  });
  const pieceUp = e => {
    if (!pdrag || pdrag.id !== e.pointerId) return;
    const d = pdrag; pdrag = null;
    if (!d.ghost) {                                                       // ---- tap
      if (e.type !== 'pointerup') return;
      const sel = pz.sel;
      if (sel && d.slotIdx != null && !(sel.from === d.slotIdx)) placeAt(sel.i, sel.from, d.slotIdx);
      else if (sel && d.i == null && d.slotIdx == null) backToTray(sel.from);   // tapped the tray background
      else if (d.i != null) selectPiece(sel && sel.i === d.i ? null : { i: d.i, from: d.from });
      return;
    }
    clearDrag();                                                          // ---- drop
    if (e.type !== 'pointerup') return;
    const slot = slotAt(e.clientX, e.clientY);
    if (slot) placeAt(d.i, d.from, slotEls().indexOf(slot));
    else if (overTray(e.clientX, e.clientY)) backToTray(d.from);
  };
  addEventListener('pointerup', pieceUp);
  addEventListener('pointercancel', pieceUp);

  // ----- celebration -----
  function win() {
    $('#pzWin').hidden = false;
    const c = $('#confetti'), x = c.getContext('2d');
    c.width = innerWidth; c.height = innerHeight;
    const bits = Array.from({ length: 160 }, () => ({
      x: Math.random() * c.width, y: -20 - Math.random() * c.height * .6,
      vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, r: 5 + Math.random() * 7,
      a: Math.random() * 6, va: (Math.random() - .5) * .3, col: CONFETTI[(Math.random() * CONFETTI.length) | 0],
    }));
    const t0 = performance.now();
    (function frame(t) {
      x.clearRect(0, 0, c.width, c.height);
      for (const b of bits) {
        b.x += b.vx; b.y += b.vy; b.a += b.va;
        x.save(); x.translate(b.x, b.y); x.rotate(b.a); x.fillStyle = b.col; x.fillRect(-b.r, -b.r / 2, b.r * 2, b.r); x.restore();
      }
      if (t - t0 < 4000 && !$('#pzWin').hidden) requestAnimationFrame(frame);
      else x.clearRect(0, 0, c.width, c.height);
    })(t0);
  }

  // ----- upload with a fixed 4:3 crop -----
  const pzDlg = $('#pzDlg'), pzPrev = $('#pzPrev');
  let pzQueue = [], pzCur = null;
  function pzCropFromZoom() {
    const { src } = pzCur, z = +$('#pzZoom').value / 100;
    const maxW = Math.min(src.width, src.height * 4 / 3);
    const w = maxW * z, h = w * 3 / 4;
    const cx = pzCur.crop ? pzCur.crop.x + pzCur.crop.w / 2 : src.width / 2;
    const cy = pzCur.crop ? pzCur.crop.y + pzCur.crop.h / 2 : src.height / 2;
    pzCur.crop = { w, h, x: cx - w / 2, y: cy - h / 2 };
    pzClamp();
  }
  function pzClamp() {
    const { src, crop } = pzCur;
    crop.x = Math.max(0, Math.min(src.width - crop.w, crop.x));
    crop.y = Math.max(0, Math.min(src.height - crop.h, crop.y));
  }
  function pzDraw() {
    const { small, src, crop } = pzCur, k = small.width / src.width;
    pzPrev.width = small.width; pzPrev.height = small.height;
    const x = pzPrev.getContext('2d');
    x.drawImage(small, 0, 0);
    const rx = crop.x * k, ry = crop.y * k, rw = crop.w * k, rh = crop.h * k;
    x.fillStyle = 'rgba(74,43,60,.55)';
    x.beginPath(); x.rect(0, 0, pzPrev.width, pzPrev.height); x.rect(rx, ry, rw, rh); x.fill('evenodd');
    x.strokeStyle = '#ff5fa2'; x.lineWidth = 5; x.strokeRect(rx, ry, rw, rh);
  }
  let pzMove = null;
  pzPrev.addEventListener('pointerdown', e => {
    if (!pzCur) return;
    e.preventDefault();
    try { pzPrev.setPointerCapture(e.pointerId); } catch {}
    pzMove = { x: e.clientX, y: e.clientY, cx: pzCur.crop.x, cy: pzCur.crop.y };
  });
  pzPrev.addEventListener('pointermove', e => {
    if (!pzMove) return;
    const k = pzCur.src.width / pzPrev.getBoundingClientRect().width;
    pzCur.crop.x = pzMove.cx + (e.clientX - pzMove.x) * k;
    pzCur.crop.y = pzMove.cy + (e.clientY - pzMove.y) * k;
    pzClamp(); pzDraw();
  });
  pzPrev.addEventListener('pointerup', () => pzMove = null);
  pzPrev.addEventListener('pointercancel', () => pzMove = null);
  $('#pzZoom').oninput = () => { pzCropFromZoom(); pzDraw(); };
  $('#pzRotate').onclick = () => {
    if (!pzCur) return;
    pzCur.src = rotate90(pzCur.src);
    pzCur.small = rotate90(pzCur.small);
    pzCur.crop = null;
    pzCropFromZoom(); pzDraw();
  };

  async function pzNext() {
    const file = pzQueue.shift();
    if (!file) return;
    busy('Abriendo imagen…');
    await nextFrame();
    try {
      const url = URL.createObjectURL(file);
      const img = await loadImg(url);
      await img.decode?.().catch(() => {});
      const src = shrink(img, 3200);
      URL.revokeObjectURL(url);
      pzCur = { src, small: shrink(src, 1000), crop: null };
      $('#pzZoom').value = 100;
      pzCropFromZoom(); pzDraw();
      $('#pzName').value = file.name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ').slice(0, 40) || 'Mi rompecabezas';
      busy();
      pzDlg.showModal();
    } catch {
      busy();
      alert('No pude abrir esa imagen 😕');
      pzNext();
    }
  }
  function pzEnqueue(files) {
    pzQueue.push(...[...files].filter(f => f.type.startsWith('image/')));
    if (!pzDlg.open) pzNext();
  }
  pzDlg.addEventListener('close', async () => {
    if (pzDlg.returnValue === 'ok' && pzCur) {
      busy('Preparando tu rompecabezas…');
      await nextFrame();
      try {
        const { src, crop } = pzCur, c = mk(PZ_W, PZ_H);
        c.getContext('2d').drawImage(src, crop.x, crop.y, crop.w, crop.h, 0, 0, PZ_W, PZ_H);
        await addPuzzle(c, $('#pzName').value.trim() || 'Mi rompecabezas');
      } finally { busy(); }
    }
    pzCur = null;
    pzNext();
  });
  $('#pzAdd').onclick = () => $('#pzFile').click();
  $('#pzFile').onchange = e => { pzEnqueue(e.target.files); e.target.value = ''; };

  async function addSamplePuzzle() {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
      <defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ec8ff"/><stop offset="1" stop-color="#d9f0ff"/></linearGradient></defs>
      <rect width="1200" height="900" fill="url(#s)"/>
      ${['#ff5a5a', '#ffa53a', '#ffe14d', '#5ed67a', '#4aa8ff', '#a46bff'].map((c, i) => `<path d="M150 640 A450 450 0 0 1 1050 640" fill="none" stroke="${c}" stroke-width="34" transform="translate(0 ${i * 34}) scale(1 ${1 - i * .03})"/>`).join('')}
      <circle cx="1030" cy="150" r="90" fill="#ffd23c"/>
      <g fill="#fff"><circle cx="230" cy="170" r="55"/><circle cx="300" cy="140" r="70"/><circle cx="370" cy="175" r="50"/></g>
      <path d="M0 700 Q300 600 600 690 T1200 660 V900 H0z" fill="#69cf5c"/>
      <path d="M0 780 Q400 720 700 790 T1200 770 V900 H0z" fill="#4bb84a"/>
      <rect x="430" y="470" width="300" height="250" fill="#ff7eb6"/>
      <path d="M400 480 L580 330 L760 480z" fill="#a46bff"/>
      <rect x="540" y="580" width="80" height="140" rx="10" fill="#ffd23c"/>
      <rect x="460" y="520" width="60" height="60" fill="#bfe6ff" stroke="#fff" stroke-width="8"/>
      <rect x="640" y="520" width="60" height="60" fill="#bfe6ff" stroke="#fff" stroke-width="8"/>
      ${[[180, 760, '#ff5a5a'], [290, 800, '#ffe14d'], [900, 770, '#4aa8ff'], [1010, 810, '#ff7eb6']].map(([x, y, c]) => `<line x1="${x}" y1="${y}" x2="${x}" y2="${y + 70}" stroke="#2f8f3a" stroke-width="8"/><circle cx="${x}" cy="${y}" r="30" fill="${c}"/><circle cx="${x}" cy="${y}" r="12" fill="#fff6a8"/>`).join('')}
    </svg>`;
    const img = await loadImg('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg));
    const c = mk(PZ_W, PZ_H);
    c.getContext('2d').drawImage(img, 0, 0, PZ_W, PZ_H);
    await addPuzzle(c, 'Arcoíris (ejemplo)', false);
  }

  // ---------- UI scale: bars are designed for a 1080×810 iPad screen ----------
  let uiScale = 1;
  function applyUiScale() {
    uiScale = Math.max(.5, Math.min(1.3, Math.min(innerWidth / 1080, innerHeight / 810)));
    document.documentElement.style.setProperty('--ui', uiScale);
  }
  applyUiScale();
  addEventListener('resize', applyUiScale);

  // ---------- Boot ----------
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  navigator.storage?.persist?.().catch(() => {});   // ask the browser not to evict saved drawings

  (async () => {
    // The AI mode was removed: forget any API key a previous version saved on this device
    try { localStorage.removeItem('colorear.geminiKey'); localStorage.removeItem('colorear.geminiModel'); } catch {}
    state.stayIn = lsGet('colorear.stayIn') !== '0';
    showLock(); showSize(); renderCrayons(); setColor(state.color); renderCountChips();
    setHomeTab(lsGet('colorear.tab') === 'puzzle' ? 'puzzle' : 'color');
    await openDB();
    const recs = await renderGallery();
    if (!recs.length) await addSample();
    const pzs = await renderPuzzles();
    if (!pzs.length) await addSamplePuzzle();
  })();
})();
</script>
